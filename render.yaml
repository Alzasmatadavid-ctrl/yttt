# KAI en Render con un clic (botón «Deploy to Render» de kai/docs/DESPLIEGUE.md).
# Crea el servidor de KAI (imagen Docker de la carpeta kai, siempre encendido) y su base de datos PostgreSQL.
# Al crearlo, Render solo pide tu clave de Claude y los datos de tu cuenta de administración:
# la clave de cifrado se genera sola, la base de datos se conecta sola y la dirección pública
# (https://….onrender.com) la toma KAI de Render sin que tengas que copiarla.
# La landing de la raíz del repositorio no se ve afectada: Render solo construye la carpeta kai.
services:
  - type: web
    name: kai
    runtime: docker
    rootDir: kai
    dockerfilePath: ./kai/Dockerfile
    dockerContext: ./kai
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kai-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: kai-db
    databaseName: kai
    user: kai
