<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlays transparentes</title>
<link rel="stylesheet" href="shared/kit.css">
<style>
  html,body{background:transparent!important}
  #stage{background:transparent!important}
  #verd{left:480px;top:800px}
  #verd .v-bar{background:rgba(2,9,19,.82)}
  #verd .v-top{padding:0 6px}
  .chap,.prog{filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
  .chap-num{background:rgba(2,9,19,.75)}
  .chap-k{color:#A9BFE8}
</style>
</head>
<body>
<!-- Genera PNG con fondo transparente para colocar encima de tus propios vídeos:
     ?mode=verdict&level=0|1|2   → sello de veredicto (abajo, centrado)
     ?mode=chapter&chap=1..10&name=Zapatillas → etiqueta de capítulo + progreso (arriba) -->
<div id="stage">
  <div id="cam"><div id="verd"></div></div>
</div>
<script src="shared/kit.js"></script>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'verdict';
if (mode === 'verdict') K.verdict(K.$('#verd'), +(q.get('level') || 0), q.get('note') || '', q.get('ctx') || '');
else K.$('#verd').remove();
K.scene({
  num: mode === 'chapter' ? +(q.get('chap') || 1) : undefined,
  name: q.get('name') || '',
  duration: 100,
  chrome: mode === 'chapter',
  render(t) { if (mode === 'verdict') K.verdictAnim(K.$('#verd'), t, 0); },
});
</script>
</body>
</html>
